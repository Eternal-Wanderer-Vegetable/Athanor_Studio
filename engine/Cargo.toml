[workspace]
resolver = "2"
members = [
    "crates/azodoc-model",
    "crates/azodoc-container",
    "crates/azodoc-convert",
    "crates/azodoc-md",
    "crates/azodoc-html",
    "crates/azodoc-docx",
    "crates/azodoc-pdf",
    "crates/azodoc-pm",
    "crates/athanor-cli",
    "crates/aludel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Athanor Studio"]
repository = "https://example.com/athanor-studio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1.2"
thiserror = "2"
ulid = "1.2"
crc32fast = "1.5"
zip = "8.6"
quick-xml = "0.42"
flate2 = "1.1"
sha2 = "0.10"
comrak = "0.55"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
base64 = "0.23"
tendril = "0.5"
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }

[profile.release]
lto = "thin"
