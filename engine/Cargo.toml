[workspace]
resolver = "2"
members = ["crates/azodoc-model", "crates/azodoc-container", "crates/athanor-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Athanor Studio"]
repository = "https://example.com/athanor-studio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1.2"
thiserror = "2"
ulid = "1.2"
crc32fast = "1.5"
zip = "8.6"
flate2 = "1.1"
sha2 = "0.10"

[profile.release]
lto = "thin"
