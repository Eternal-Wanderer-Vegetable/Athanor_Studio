<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aludel — Azodoc 编辑器（M6 原型）</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0; background: #f6f4ef; color: #2c2620; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 12px 20px; background: #2c2620; color: #f6f4ef; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 2px; }
  header .sub { font-size: 12px; opacity: .75; }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  h2 { font-size: 13px; margin: 0 0 6px; color: #7a6a52; text-transform: uppercase; letter-spacing: 1px; }
  textarea { width: 100%; height: 55vh; font-family: Consolas, monospace; font-size: 12px; padding: 10px; border: 1px solid #d8d0c0; border-radius: 6px; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; background: #8c5a2b; color: #fff; cursor: pointer; font-size: 14px; }
  button.secondary { background: #5a6b52; }
  button:disabled { opacity: .5; cursor: wait; }
  .bar { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  #msg { font-size: 13px; white-space: pre-wrap; }
  .ok { color: #3d6b35; } .bad { color: #a33c2f; }
  aside section { background: #fff; border: 1px solid #e4dcc8; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  ul { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.7; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; background: #eee3cf; color: #6b5636; margin-right: 4px; }
  .tag.human { background: #dde8d5; color: #3d6b35; }
  .tag.ai { background: #e3ddf2; color: #55468a; }
  .detached { color: #a33c2f; }
</style>
</head>
<body>
<header>
  <h1>ALUDEL</h1>
  <span class="sub">Azodoc 编辑器原型 · <span id="doc"></span></span>
  <span class="sub">当前修订: <span id="rev">—</span></span>
</header>
<main>
  <section>
    <h2>编辑器状态（ProseMirror JSON）</h2>
    <textarea id="pm" spellcheck="false"></textarea>
    <div class="bar">
      <button id="save">保存（落链 author:human）</button>
      <button id="verify" class="secondary">athanor verify</button>
      <input id="message" placeholder="修订说明（可空）" style="flex:1; padding:8px; border:1px solid #d8d0c0; border-radius:6px;">
    </div>
    <div class="bar"><span id="msg"></span></div>
  </section>
  <aside>
    <section><h2>修订历史</h2><ul id="history"></ul></section>
    <section><h2>语义标注</h2><ul id="anns"></ul></section>
    <section><h2>未知内容 / 损失盘点</h2><ul id="loss"></ul></section>
    <section><h2>容器警告</h2><ul id="warns"></ul></section>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const setMsg = (text, ok) => { $("msg").textContent = text; $("msg").className = ok ? "ok" : "bad"; };

function authorTag(t) { const s = document.createElement("span"); s.className = "tag " + (t === "human" ? "human" : t === "ai" ? "ai" : ""); s.textContent = t; return s; }

async function load() {
  const d = await (await fetch("/api/doc")).json();
  $("doc").textContent = d.path;
  $("rev").textContent = d.revision || "（未落链）";
  $("pm").value = JSON.stringify(d.pm_doc, null, 2);
  $("history").replaceChildren(...(d.history || []).slice().reverse().map(e => {
    const li = document.createElement("li");
    li.append(authorTag(e.author_type), document.createTextNode(` ${e.id} · ${e.message || "（无说明）"}${e.is_current ? " ⟵当前" : ""}`));
    return li;
  }));
  $("anns").replaceChildren(...(d.annotations?.annotations || []).map(a => {
    const li = document.createElement("li");
    if (a.detached) li.className = "detached";
    li.textContent = `${a.id} [${a.type}] @${a.target?.block || "?"}${a.detached ? " · 失配 detached" : ""}`;
    return li;
  }));
  const ls = d.loss_summary || {};
  $("loss").replaceChildren(
    ...(ls.unknown_blocks || []).map(u => { const li = document.createElement("li"); li.textContent = `unknown · ${u.summary || ""}（${u.loss_class || "?"}）`; return li; }),
    ...((ls.detached_annotations || 0) ? [Object.assign(document.createElement("li"), { textContent: `失配标注 ${ls.detached_annotations} 条`, className: "detached" })] : [])
  );
  $("warns").replaceChildren(...(d.warnings || []).map(w => Object.assign(document.createElement("li"), { textContent: w })));
}

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  return { status: r.status, data: await r.json() };
}

$("save").onclick = async () => {
  $("save").disabled = true; setMsg("保存中…", true);
  try {
    let pm;
    try { pm = JSON.parse($("pm").value); } catch (e) { setMsg("PM JSON 解析失败: " + e.message, false); return; }
    const { status, data } = await post("/api/save", { pm_doc: pm, message: $("message").value || undefined });
    if (status === 200) {
      const rel = data.relocate ? ` · 标注 未变${data.relocate.unchanged}/重锚${data.relocate.reanchored}/迁移${data.relocate.moved}/失配${data.relocate.detached}` : "";
      setMsg(`已落链 ${data.revision}（author:human，新 ID ${data.ids_assigned}）${rel}`, true);
      await load();
    } else {
      setMsg("保存被拒绝: " + (data.error || status), false);
    }
  } finally { $("save").disabled = false; }
};

$("verify").onclick = async () => {
  $("verify").disabled = true; setMsg("verify 运行中…", true);
  try {
    const { data } = await post("/api/verify");
    setMsg(data.ok ? "athanor verify 通过 ✓" : "athanor verify 未通过（见服务端输出）", data.ok);
  } finally { $("verify").disabled = false; }
};

load();
</script>
</body>
</html>
