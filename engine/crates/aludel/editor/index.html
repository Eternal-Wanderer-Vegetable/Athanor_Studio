<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Athanor Studio</title>
</head>
<body>
  <header class="topbar">
    <div class="appbar" role="banner">
      <span class="brand">Athanor</span>
      <span class="doc-name" id="doc-path">…</span>
      <span class="doc-status" id="doc-status">
        <span class="doc-name">修订: <span id="rev">—</span></span>
      </span>
      <span class="spacer"></span>
      <input class="cmd-search" id="cmdk-input" type="text" placeholder="命令搜索 (Ctrl+K)" aria-label="命令搜索" readonly />
      <button id="topbar-save" data-cmd="file.save">保存</button>
    </div>
    <nav class="menubar" role="menubar" aria-label="应用菜单" id="app-menus"></nav>
  </header>

  <div class="tabbar" role="tablist" aria-label="功能区页签" id="ribbon-tabs"></div>
  <div class="ribbon" role="toolbar" aria-label="编辑工具栏" id="ribbon-panel"></div>

  <div id="findbar" role="search" aria-label="查找与替换">
    <input type="text" id="find-input" placeholder="查找" />
    <label><input type="checkbox" id="find-case" /> 区分大小写</label>
    <button id="find-prev">上一个</button>
    <button id="find-next">下一个</button>
    <span id="find-count"></span>
    <span id="find-replace-row" style="display:none; gap:6px; align-items:center;">
      <input type="text" id="replace-input" placeholder="替换为" />
      <button id="replace-one">替换</button>
      <button id="replace-all">全部替换</button>
    </span>
    <button id="find-close" aria-label="关闭查找栏">✕</button>
  </div>

  <main>
    <nav class="rail" role="navigation" aria-label="导航轨" id="left-rail">
      <button id="rail-outline" data-cmd="view.toggleOutline" title="大纲" aria-label="大纲面板">≡</button>
      <button id="rail-find" data-cmd="edit.find" title="查找" aria-label="查找">⌕</button>
      <button id="rail-comments" data-cmd="panels.comments" title="批注" aria-label="批注">✎</button>
    </nav>
    <aside class="nav-pane" id="left-panel" aria-label="文档大纲">
      <h2>大纲</h2>
      <ul id="outline"></ul>
    </aside>
    <div class="workspace">
      <div class="page"><div id="editor" aria-label="文档正文" role="textbox" aria-multiline="true"></div></div>
    </div>
    <aside class="side-pane inspector-pane" id="right-panel" aria-label="检查面板">
      <section id="inspector-context"><h2>属性</h2><div id="inspector-body"></div></section>
      <section><h2>修订历史</h2><ul id="history"></ul></section>
      <section><h2>语义标注</h2><ul id="annotations"></ul></section>
      <section><h2>未知内容 / 损失盘点</h2><ul id="loss"></ul></section>
      <section><h2>容器警告</h2><ul id="warnings"></ul></section>
    </aside>
  </main>

  <div class="bar">
    <input id="message" placeholder="修订说明（可选）" aria-label="修订说明" />
  </div>
  <div id="msg" role="status" aria-live="polite"></div>
  <footer class="statusbar" role="status" aria-label="状态栏">
    <span id="sb-chars">0 字</span>
    <span id="sb-save">已保存</span>
    <span id="sb-page" title="最近预览分页结果"></span>
    <span id="sb-mode">连续编辑</span>
    <span id="sb-lang">中文</span>
    <span class="spacer"></span>
    <span id="sb-view" class="sb-view-slot"></span>
    <button id="sb-zoom-out" data-cmd="view.zoomOut" aria-label="缩小">−</button>
    <button id="sb-zoom-reset" data-cmd="view.zoomReset" aria-label="缩放还原"><span id="sb-zoom">100%</span></button>
    <button id="sb-zoom-in" data-cmd="view.zoomIn" aria-label="放大">＋</button>
  </footer>

  <script>
    window.addEventListener("error", (e) => {
      const m = document.getElementById("msg");
      if (m) {
        m.textContent = "脚本错误: " + (e.error?.message ?? e.message);
        m.className = "bad";
      }
    });
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
