[package]
name = "athanor-cli"
description = "Athanor — Azodoc 引擎命令行（new / info / verify / recover）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "athanor"
path = "src/main.rs"

[dependencies]
azodoc-model = { path = "../azodoc-model" }
azodoc-container = { path = "../azodoc-container" }
azodoc-convert = { path = "../azodoc-convert" }
azodoc-md = { path = "../azodoc-md" }
azodoc-html = { path = "../azodoc-html" }
azodoc-docx = { path = "../azodoc-docx" }
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
