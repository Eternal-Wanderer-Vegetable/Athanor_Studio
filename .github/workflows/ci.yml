# Athanor 引擎 CI：rustfmt + clippy(-D warnings) + cargo test（双平台矩阵）。
# Cargo workspace 位于 engine/。可选外部工具在 CI 中齐备：
#   - pandoc：Linux 经 apt 安装；Windows 经 choco 安装（DOCX e2e 测试）
#   - 浏览器：ubuntu 自带 google-chrome；Windows 自带 Edge（PDF e2e 测试）

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Bound parallel compiler/linker memory on hosted runners. Keep debug
  # assertions enabled, but omit debug symbols from CI build artifacts.
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  editor:
    name: editor (build and interaction tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/crates/aludel/editor/package-lock.json
      - name: Install editor dependencies
        working-directory: engine/crates/aludel/editor
        run: npm ci
      - name: Build editor bundle
        working-directory: engine/crates/aludel/editor
        run: npm run build
      - name: Unit tests
        working-directory: engine/crates/aludel/editor
        run: npm test -- --reporter=dot
      - name: Install Playwright browser
        working-directory: engine/crates/aludel/editor
        run: npx playwright install --with-deps chromium
      - name: Browser interaction tests
        working-directory: engine/crates/aludel/editor
        run: npm run test:e2e

  schema:
    name: Schema structure and golden samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: Compare model and normative schema structure
        working-directory: engine
        run: cargo test -p azodoc-model --test golden_schema

  test:
    name: ci (${{ matrix.os }})
    # Bound stalled runs while allowing a cold Tauri dependency build.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pandoc \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      - name: Install Pandoc (Windows)
        if: runner.os == 'Windows'
        run: choco install pandoc -y --no-progress

      - name: Format check
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Clippy（警告即错误）
        timeout-minutes: 20
        working-directory: engine
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Compile tests
        timeout-minutes: 30
        working-directory: engine
        run: cargo test --workspace --no-run

      - name: Tests
        timeout-minutes: 10
        working-directory: engine
        run: cargo test --workspace
