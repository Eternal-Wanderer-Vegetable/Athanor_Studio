# Athanor 引擎 CI：rustfmt + clippy(-D warnings) + cargo test（双平台矩阵）。
# Cargo workspace 位于 engine/。可选外部工具在 CI 中齐备：
#   - pandoc：ubuntu 预装；Windows 经 choco 安装（DOCX e2e 测试）
#   - 浏览器：ubuntu 自带 google-chrome；Windows 自带 Edge（PDF e2e 测试）

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Pandoc (Windows)
        if: runner.os == 'Windows'
        run: choco install pandoc -y --no-progress

      - name: Format check
        working-directory: engine
        run: cargo fmt --all -- --check

      - name: Clippy（警告即错误）
        working-directory: engine
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: engine
        run: cargo test --workspace
