# Athanor Studio 发布流水线：打 tag v* 自动产出 Windows / Linux 安装包并挂到
# GitHub Release；workflow_dispatch 仅产出 artifact（演练用，不发版）。
#
# 产物：
#   Windows: Athanor Studio_<ver>_x64-setup.exe（NSIS，内嵌 WebView2 引导器）
#            AthanorStudio_<ver>_x64_portable.zip（免安装，含内置 Pandoc）
#   Linux:   Athanor Studio_<ver>_amd64.AppImage（免安装）
#            athanor-studio_<ver>_amd64.deb
#
# 内置 Pandoc（DOCX 导入导出开箱即用）：双平台同版本，从 pandoc 官方 release
# 取包（比发行版 apt/choco 的产物更可复现、跨发行版可用），以 Tauri resources
# 打包进 tools/pandoc-bundled/；studio 启动时经 resource_dir 探测并注入
# AZODOC_PANDOC_PATH（见 engine/crates/studio/src/lib.rs）。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PANDOC_VERSION: "3.6.4"

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/crates/aludel/editor/package-lock.json

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      # 前端产物重建（tsc + vite → 单文件 dist/index.html），发布时保证与源码一致。
      - name: Build editor bundle
        working-directory: engine/crates/aludel/editor
        run: |
          npm ci
          npm run build

      - name: Stage built-in Pandoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = $env:PANDOC_VERSION
          $tmp = Join-Path $env:RUNNER_TEMP "pandoc"
          curl.exe -sSL -o "$tmp.zip" "https://github.com/jgm/pandoc/releases/download/$v/pandoc-$v-windows-x86_64.zip"
          Expand-Archive "$tmp.zip" -DestinationPath $tmp -Force
          $stage = "engine/crates/studio/tools/pandoc-bundled"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$tmp/pandoc-$v-windows-x86_64/pandoc.exe" "$stage/pandoc.exe"
          & "$stage/pandoc.exe" --version | Select-Object -First 1

      - name: Stage built-in Pandoc (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          v="$PANDOC_VERSION"
          wget -q "https://github.com/jgm/pandoc/releases/download/$v/pandoc-$v-linux-amd64.tar.gz"
          tar xzf "pandoc-$v-linux-amd64.tar.gz"
          stage="engine/crates/studio/tools/pandoc-bundled"
          mkdir -p "$stage"
          cp "pandoc-$v-linux-amd64/bin/pandoc" "$stage/pandoc"
          "$stage/pandoc" --version | head -1

      - name: Resolve app version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.1.0" >> "$GITHUB_ENV"
          fi

      # 版本号与 resources（内置 Pandoc）经 --config merge 注入，
      # 已提交的 tauri.conf.json 保持对本地开发零影响。
      # 打包目标由平台配置文件固化：tauri.windows.conf.json → nsis，
      # tauri.linux.conf.json → appimage + deb。
      # Tauri CLI 从 CWD 向上发现 tauri.conf.json，故须在 studio crate 目录执行；
      # CLI 本体取自 editor 的 node_modules（tauri:build 脚本同款调用方式）。
      - name: Tauri bundle
        working-directory: engine/crates/studio
        run: |
          node ../aludel/editor/node_modules/@tauri-apps/cli/tauri.js build \
            --config "{\"version\":\"$APP_VERSION\",\"bundle\":{\"resources\":[\"tools/pandoc-bundled\"]}}"

      - name: Assemble portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $layout = Join-Path $env:RUNNER_TEMP "AthanorStudio-$env:APP_VERSION-portable"
          New-Item -ItemType Directory -Force (Join-Path $layout "tools/pandoc-bundled") | Out-Null
          Copy-Item engine/target/release/studio.exe $layout/
          Copy-Item engine/crates/studio/tools/pandoc-bundled/pandoc.exe (Join-Path $layout "tools/pandoc-bundled/")
          Compress-Archive -Path $layout -DestinationPath "AthanorStudio_$env:APP_VERSION_x64_portable.zip" -Force

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          if-no-files-found: error
          path: |
            engine/target/release/bundle/nsis/*.exe
            AthanorStudio_*_x64_portable.zip

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-linux
          if-no-files-found: error
          path: |
            engine/target/release/bundle/appimage/*.AppImage
            engine/target/release/bundle/deb/*.deb

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
