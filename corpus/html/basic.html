<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HTML 语料</title>
</head>
<body>
<article>
<h1>HTML 语料</h1>
<p>包含 <strong>加粗</strong>、<em>斜体</em>、<u>下划线</u>、<s>删除线</s>、<code>行内代码</code> 与<a href="https://example.com/page" title="提示">链接</a>的段落。</p>
<h2>列表</h2>
<ul>
<li>第一项</li>
<li>嵌套
<ul>
<li>深层项</li>
</ul>
</li>
<li>第三项</li>
</ul>
<ol start="3">
<li>有序三</li>
<li>有序四</li>
</ol>
<blockquote><p>引用内容。</p></blockquote>
<pre><code class="language-python">print("hello")</code></pre>
<hr>
<table>
<thead>
<tr><th>名称</th><th>数值</th></tr>
</thead>
<tbody>
<tr><td>甲</td><td>十二</td></tr>
</tbody>
</table>
<figure>
<img src="https://example.com/img.png" alt="网络图">
<figcaption>图片题注</figcaption>
</figure>
<p>段落末尾<br>硬换行。</p>
</article>
</body>
</html>
